---
- name: Despliegue de la Aplicación MortgageBank
  hosts: production
  become: yes
  tasks:
    - name: Asegurar que Git y Docker están instalados
      apt:
        name:
          - git
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: yes

    - name: Clonar o actualizar el repositorio del proyecto
      git:
        repo: 'https://github.com/tu-usuario/MortgageBank.git'
        dest: /opt/MortgageBank
        version: main

    - name: Desplegar la pila con Docker Compose
      command: docker compose up -d --build
      args:
        chdir: /opt/MortgageBank