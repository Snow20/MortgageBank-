apiVersion: apps/v1
kind: Deployment

metadata:

  name: rabbitmq

  namespace: mortgagebank

spec:

  replicas: 1

  selector:

    matchLabels:

      app: rabbitmq

  template:

    metadata:

      labels:

        app: rabbitmq

    spec:

      containers:

        - name: rabbitmq

          image:
            rabbitmq:4-management

          ports:

            - containerPort: 5672

            - containerPort: 15672

          env:

            - name:
                RABBITMQ_DEFAULT_USER

              value:
                mortgage

            - name:
                RABBITMQ_DEFAULT_PASS

              value:
                mortgagepass